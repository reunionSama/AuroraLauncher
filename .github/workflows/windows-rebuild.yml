          name: AuroraLauncher-Windows-evidence
          run-id: 41415135317
          github-token: ${{ github.token }}
          path: evidence
      - name: Prepare setup icon and record the tested application source
        run: |
          python make_assets.py
          @{ application_commit = 'a992dbf8903017c84e45c8a75080b1a1f3e275e9'; application_test_run = 41415135317; installer_commit = '${{ github.sha }}' } | ConvertTo-Json | Out-File ../evidence/application-provenance.json -Encoding utf8
      - name: Sign launcher when a trusted publisher certificate is configured
        env:
          AURORA_SIGNING_PFX_BASE64: ${{ secrets.AURORA_SIGNING_PFX_BASE64 }}
          AURORA_SIGNING_PFX_PASSWORD: ${{ secrets.AURORA_SIGNING_PFX_PASSWORD }}
        run: ./sign_windows.ps1 -Target dist/AuroraLauncher/AuroraLauncher.exe
      - name: Create native Windows installer
