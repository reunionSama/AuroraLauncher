name: Aurora Windows Desktop Rebuild
on:
  push:
    branches: [windows-rebuild-20261030]
    paths: ['desktop/**', '.github/workflows/windows-rebuild.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: aurora-windows-desktop
  cancel-in-progress: true
jobs:
  windows:
    if: ${{ !contains(github.event.head_commit.message, '[installer-only]') }}
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
      QT_QUICK_BACKEND: software
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            desktop/requirements-build.txt
            desktop/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned build dependencies
        run: python -m pip install --index-url https://pypi.org/simple --timeout 20 --retries 2 -r requirements-build.txt
      - name: Prepare original assets and licensed font
        run: python bootstrap_assets.py
      - name: Build original game branding component
        run: python build_branding.py
      - name: Test download integrity, accounts, archives, launch command and gestures
        run: python -m pytest tests -q --junitxml=../evidence/unit-tests.xml
      - name: Exercise desktop source UI
        run: |
          python main.py --self-test --data-dir "$env:RUNNER_TEMP\aurora-source-test" --test-report ../evidence/source-ui.json --screenshot-dir ../evidence/source-screens
          if ($LASTEXITCODE -ne 0) { throw 'Source UI smoke failed' }
      - name: Verify Microsoft device registration and returned login address
        run: python tests/oauth_preflight.py ../evidence/oauth-registration.json
      - name: Verify official Terracotta Windows component and local API
        run: python tests/terracotta_smoke.py "$env:RUNNER_TEMP\aurora-terra-test" ../evidence/terracotta.json
      - name: Verify real Fabric, Quilt, Forge, OptiFine, NeoForge and Fabric API installation
        run: python tests/installers_smoke.py "$env:RUNNER_TEMP\aurora-game-test" ../evidence/installers.json
      - name: Build installed Windows application
        run: python -m PyInstaller --noconfirm --clean AuroraLauncher.spec
      - name: Sign launcher when a trusted publisher certificate is configured
        env:
          AURORA_SIGNING_PFX_BASE64: ${{ secrets.AURORA_SIGNING_PFX_BASE64 }}
          AURORA_SIGNING_PFX_PASSWORD: ${{ secrets.AURORA_SIGNING_PFX_PASSWORD }}
        run: ./sign_windows.ps1 -Target dist/AuroraLauncher/AuroraLauncher.exe
      - name: Run the actual packaged EXE and exercise every page
        run: |
          $p = Start-Process -FilePath dist/AuroraLauncher/AuroraLauncher.exe -ArgumentList @('--self-test','--data-dir',"$env:RUNNER_TEMP\aurora-exe-test",'--test-report',"$pwd\..\evidence\exe-ui.json",'--screenshot-dir',"$pwd\..\evidence\exe-screens") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE smoke failed: $($p.ExitCode)" }
          $r = Get-Content ../evidence/exe-ui.json | ConvertFrom-Json
          if (-not $r.ok -or -not $r.frozen) { throw 'Packaged executable did not pass UI validation' }
      - name: Provide software OpenGL only for the CI virtual machine
        run: |
          curl.exe -fL --retry 3 https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z -o "$env:RUNNER_TEMP\mesa.7z"
          if ($LASTEXITCODE -ne 0) { throw 'Mesa test dependency download failed' }
          7z x "$env:RUNNER_TEMP\mesa.7z" "-o$env:RUNNER_TEMP\mesa" -y | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP\mesa\x64" -Filter *.dll | Copy-Item -Destination "$env:JAVA_HOME\bin" -Force
          if (-not (Test-Path "$env:JAVA_HOME\bin\opengl32.dll")) { throw 'Software OpenGL was not installed in the temporary Java runtime' }
      - name: Real Minecraft demo launch through the packaged EXE
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: |
          $p = Start-Process -FilePath dist/AuroraLauncher/AuroraLauncher.exe -ArgumentList @('--game-smoke','--game-version','1.20.1','--data-dir',"$env:RUNNER_TEMP\aurora-game-test",'--test-report',"$pwd\..\evidence\minecraft-demo.json",'--screenshot-dir',"$pwd\..\evidence\game-screens") -Wait -PassThru
          Copy-Item "$env:RUNNER_TEMP\aurora-game-test\logs\launcher-latest.log" ../evidence/minecraft-launch.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Minecraft demo smoke failed: $($p.ExitCode)" }
          $r = Get-Content ../evidence/minecraft-demo.json | ConvertFrom-Json
          if (-not $r.ok -or -not $r.game_window -or -not $r.renderer_initialized) { throw 'A real Minecraft window was not verified' }
      - name: Create native Windows installer
        run: |
          python make_installer_art.py
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup 6 is missing from the Windows build image' }
          & $compiler installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Sign setup when a trusted publisher certificate is configured
        env:
          AURORA_SIGNING_PFX_BASE64: ${{ secrets.AURORA_SIGNING_PFX_BASE64 }}
          AURORA_SIGNING_PFX_PASSWORD: ${{ secrets.AURORA_SIGNING_PFX_PASSWORD }}
        run: ./sign_windows.ps1 -Target dist/AuroraLauncher-Setup.exe
      - name: Install, run installed application, and uninstall in a temporary directory
        run: python tests/installer_smoke.py dist/AuroraLauncher-Setup.exe ../evidence
      - name: Retrieve previous shipped EXE for same-machine comparison
        uses: actions/download-artifact@v4
        with:
          name: AuroraLauncher-Windows-tested
          run-id: 41026525241
          github-token: ${{ github.token }}
          path: baseline
      - name: Measure startup, foreground and background resources against 6.1.0
        run: python tests/windows_performance.py ../baseline/AuroraLauncher.exe dist/AuroraLauncher/AuroraLauncher.exe ../evidence/performance.json
      - name: Inspect Authenticode status and available Defender protection
        run: |
          $files = @('dist/AuroraLauncher/AuroraLauncher.exe','dist/AuroraLauncher-Setup.exe')
          $signatures = @($files | ForEach-Object { $sig = Get-AuthenticodeSignature $_; @{ file = $_; status = [string]$sig.Status; publisher = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { $null } } })
          $signatures | ConvertTo-Json -Depth 4 | Out-File ../evidence/signatures.json -Encoding utf8
          try {
            $status = Get-MpComputerStatus -ErrorAction Stop
            if ($status.AntivirusEnabled) {
              Start-MpScan -ScanType CustomScan -ScanPath "$pwd\dist" -ErrorAction Stop
              $detections = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object { $_.Resources -match 'AuroraLauncher' })
              @{available=$true; scan_completed=$true; detections=$detections.Count} | ConvertTo-Json | Out-File ../evidence/defender.json -Encoding utf8
              if ($detections.Count -gt 0) { throw 'Defender reported a detection in the build output' }
            } else {
              @{available=$false; scan_completed=$false; reason='Defender is not enabled on this CI image'} | ConvertTo-Json | Out-File ../evidence/defender.json -Encoding utf8
            }
          } catch {
            if (Test-Path ../evidence/defender.json) { throw }
            @{available=$false; scan_completed=$false; reason=$_.Exception.Message} | ConvertTo-Json | Out-File ../evidence/defender.json -Encoding utf8
          }
      - name: Collect executable and corresponding source
        run: |
          New-Item -ItemType Directory -Force ../deliverables | Out-Null
          Copy-Item dist/AuroraLauncher-Setup.exe ../deliverables/AuroraLauncher-Setup.exe
          Compress-Archive -Path dist/AuroraLauncher -DestinationPath ../deliverables/AuroraLauncher-Portable.zip
          Get-FileHash ../deliverables/AuroraLauncher-Setup.exe -Algorithm SHA256 | Format-List | Out-File ../deliverables/SHA256.txt -Encoding utf8
          Copy-Item ../LICENSE ../deliverables/LICENSE.txt
          Copy-Item assets/THIRD_PARTY_NOTICES.txt ../deliverables/THIRD_PARTY_NOTICES.txt
          git rev-parse HEAD | Out-File ../deliverables/SOURCE_COMMIT.txt -Encoding utf8
          python package_source.py
      - name: Upload tested Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: AuroraLauncher-Windows-tested
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
      - name: Upload tests, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraLauncher-Windows-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve executable for diagnosing failed integration tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraLauncher-Windows-diagnostic-EXE
          path: desktop/dist/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: AuroraLauncher-Windows-source
          path: AuroraLauncher-Desktop-source.zip
          if-no-files-found: error
          retention-days: 30


  installer:
    if: ${{ contains(github.event.head_commit.message, '[installer-only]') }}
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      QT_QUICK_BACKEND: software
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify that the previously tested application code is unchanged
        run: |
          $base = 'a992dbf8903017c84e45c8a75080b1a1f3e275e9'
          $changed = @(git diff --name-only $base HEAD)
          foreach ($path in $changed) {
            if ($path -notmatch '^desktop/(installer\.iss|installer_languages/|make_installer_art\.py|tests/(installer_smoke|windows_performance)\.py)' -and $path -ne '.github/workflows/windows-rebuild.yml') {
              throw "Application source changed: $path; a full rebuild is required."
            }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging and measurement tools
        run: python -m pip install --index-url https://pypi.org/simple --timeout 20 --retries 2 pillow==13.0.0 psutil==7.2.2
      - name: Retrieve the application that passed unit, UI, loader and Minecraft checks
        uses: actions/download-artifact@v4
        with:
          name: AuroraLauncher-Windows-diagnostic-EXE
          run-id: 41415135317
          github-token: ${{ github.token }}
          path: desktop/dist
      - name: Carry the corresponding completed checks into the evidence
        uses: actions/download-artifact@v4
